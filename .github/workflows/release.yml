name: Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Restore shared signing key (if configured)
        run: |
          if [ -z "${DEBUG_KEYSTORE_BASE64:-}" ]; then
            echo "Secret DEBUG_KEYSTORE_BASE64 absent : signature avec la clé debug"
            echo "générée par le runner (mise à jour impossible par-dessus une install"
            echo "existante — voir README « Signature des APK »)."
            exit 0
          fi
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > shared-debug.keystore
          # Convertit le keystore en JKS : les PKCS12 générés par les keytool
          # récents utilisent des algorithmes que le lecteur de signature AGP
          # ne parse pas (« Tag number over 30 is not supported »).
          keytool -importkeystore \
            -srckeystore shared-debug.keystore -srcstorepass "$DEBUG_KEYSTORE_PASSWORD" -srcalias "$DEBUG_KEY_ALIAS" \
            -destkeystore signing.keystore -deststoretype JKS \
            -deststorepass "$DEBUG_KEYSTORE_PASSWORD" -destkeypass "$DEBUG_KEY_PASSWORD" -destalias "$DEBUG_KEY_ALIAS" -noprompt
          echo "DEBUG_KEYSTORE_PATH=$PWD/signing.keystore" >> "$GITHUB_ENV"
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD || 'android' }}
          DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS || 'androiddebugkey' }}
          DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD || 'android' }}

      - name: Build release APK (signed with the shared key)
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APK to include version tag
        run: |
          TAG=${GITHUB_REF_NAME}
          cp app/build/outputs/apk/release/*.apk meteoapp-${TAG}.apk
          ls -lh meteoapp-${TAG}.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: meteoapp-*.apk
          fail_on_unmatched_files: true
