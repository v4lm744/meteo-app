name: Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK (signed with debug key, installable)
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK to include version tag
        run: |
          TAG=${GITHUB_REF_NAME}
          cp app/build/outputs/apk/debug/*.apk meteoapp-${TAG}.apk
          ls -lh meteoapp-${TAG}.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: meteoapp-*.apk
          fail_on_unmatched_files: true
