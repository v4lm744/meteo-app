version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      androidx:
        patterns:
          - "androidx.*"
      kotlin-and-coroutines:
        patterns:
          - "org.jetbrains.kotlin*"
          - "kotlin*"
          - "org.jetbrains.kotlinx.*"
      square:
        patterns:
          - "com.squareup.*"
      build-plugins:
        patterns:
          - "com.google.devtools.*"
          - "com.android.*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns:
          - "*"
